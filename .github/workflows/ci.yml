name: CI

# Se ejecuta en cada Pull Request hacia main y cada vez que algo se integra a main
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-test-services:
    name: build-test-services (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cada servicio nuevo se debe agregar a esta lista
        service: [ identidad, alojamientos, cotizacion, disponibilidad, busqueda, reservas, pagos, notificaciones, reportes, resenas, auditoria ]
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Compilar y ejecutar las pruebas
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar -Dsonar.organization=proyecto-software-marketing -Dsonar.projectKey=proyecto-software-marketing_${{ matrix.service }} -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # compila el front de Angular en cada PR para saber que no se rompio nada
  build-test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # instala node para poder usar npm y angular
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # instala las librerias tal cual estan en el package-lock
      - run: npm ci

      # si esto falla es porque algo del front no compila
      - run: npx ng build
