name: CI

# Se ejecuta en cada Pull Request hacia main y cada vez que algo se integra a main
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-test-services:
    name: build-test-services (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Cada servicio nuevo se agrega a esta lista
        service: [ identidad, disponibilidad ]
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Compilar y ejecutar las pruebas
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -B verify
