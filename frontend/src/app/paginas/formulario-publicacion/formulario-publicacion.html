<h1>{{id ? 'Editar alojamiento' : 'Publicar alojamiento'}}</h1>
<p class="subtitulo">{{id ? 'Modifica los datos de tu publicación.' : 'Crea un borrador. Después podrás enviarlo a revisión.'}}</p>
@if(cargando()){<p>Cargando alojamiento...</p>}
@for(error of errores();track $index){<p class="error" role="alert">{{error}}</p>}
@if(!cargando()){
<form class="tarjeta formulario" (ngSubmit)="guardar()" #form="ngForm">
<label class="campo">Título <input name="titulo" [(ngModel)]="datos.titulo" required maxlength="150" /></label>
<label class="campo">Descripción <textarea name="descripcion" [(ngModel)]="datos.descripcion" required rows="4"></textarea></label>
<label class="campo">Ciudad <input name="ciudad" [(ngModel)]="datos.ciudad" required /></label>
<label class="campo">Ubicación textual <input name="ubicacionTextual" [(ngModel)]="datos.ubicacionTextual" required placeholder="Barrio, dirección o referencia" /></label>
<label class="campo">Tipo de alojamiento <select name="tipoAlojamiento" [(ngModel)]="datos.tipoAlojamiento" required><option value="APARTAMENTO">Apartamento</option><option value="CASA">Casa</option><option value="HABITACION">Habitación</option><option value="CABANA">Cabaña</option><option value="OTRO">Otro</option></select></label>
<label class="campo">Capacidad de huéspedes <input type="number" name="capacidad" [(ngModel)]="datos.capacidad" required min="1" step="1" /></label>
<label class="campo">Precio por noche (COP) <input type="number" name="precioPorNoche" [(ngModel)]="datos.precioPorNoche" required min="1" step="any" /></label>
<div class="acciones"><button class="boton" type="submit" [disabled]="form.invalid || guardando()">{{guardando() ? 'Guardando...' : (id ? 'Guardar cambios' : 'Crear borrador')}}</button><a routerLink="/mis-publicaciones">Cancelar</a></div>
</form>
}
