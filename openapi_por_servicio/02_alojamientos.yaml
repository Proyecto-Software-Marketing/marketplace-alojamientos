openapi: 3.0.3
info:
  title: Servicio Alojamientos - Marketplace de Alojamientos
  version: 1.0.0
  description: 'Contrato del servicio Alojamientos: rutas públicas (las enruta el API Gateway) y rutas internas /internal/* e /interno/* (solo dentro de la red de Docker Compose, sin token). Los errores se responden como {"mensajes": [...]}. Swagger UI: http://localhost:8082/swagger-ui.html'
servers:
- url: http://localhost:8082
  description: Servicio Alojamientos (local)
security:
- bearerAuth: []
tags:
- name: Alojamientos
paths:
  /listings:
    post:
      tags:
      - Alojamientos
      summary: Crear publicación en BORRADOR
      operationId: createListing
      description: 'Historias: HU-07. Rol requerido: ANFITRION (Huésped y Administrador reciben 403). La publicación queda en BORRADOR asociada al anfitrión del token; id, anfitrionId y estado se ignoran si vienen en el cuerpo. No se valida título repetido. La respuesta trae servicios, reglas e imagenes como listas vacías hasta la HU-09. 400: falta un campo, capacidad fuera de 1 a 50 o con decimales, precio no positivo o con decimales, tipo fuera de la lista o JSON mal formado.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingInput'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '503':
          $ref: '#/components/responses/E503'
  /listings/mine:
    get:
      tags:
      - Alojamientos
      summary: Consultar mis publicaciones con su estado
      operationId: myListings
      description: 'Historias: HU-15. Rol requerido: ANFITRION.'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingList'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
  /listings/{id}:
    get:
      tags:
      - Alojamientos
      summary: Consultar una publicación (propietario o administrador)
      operationId: getListing
      description: 'Historias: HU-08. Rol requerido: ANFITRION, ADMINISTRADOR.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    put:
      tags:
      - Alojamientos
      summary: Editar publicación (propietario o administrador)
      operationId: updateListing
      description: 'Historias: HU-08. Rol requerido: ANFITRION, ADMINISTRADOR.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingInput'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /listings/{id}/amenities:
    put:
      tags:
      - Alojamientos
      summary: Definir servicios (amenities)
      operationId: setAmenities
      description: 'Historias: HU-09 (CA-026). Rol requerido: ANFITRION. Reemplaza la lista completa (una lista vacía quita todo) y responde la publicación. Se puede en BORRADOR, ACTIVA y PAUSADA, sin cambiar el estado; en PENDIENTE_REVISION o BLOQUEADA responde 409. La publicación de otro anfitrión responde 404. Solo servicios del catálogo: Wifi, Cocina, Aire acondicionado, Lavadora, Aparcamiento, Piscina; se aceptan sin distinguir mayúsculas, se guardan con la escritura del catálogo, sin repetidos y en su orden (así funcionan como filtro en Búsqueda). 400: falta la lista o un servicio no está en el catálogo.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmenitiesInput'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
  /listings/{id}/rules:
    put:
      tags:
      - Alojamientos
      summary: Definir reglas del alojamiento
      operationId: setRules
      description: 'Historias: HU-09 (CA-027). Rol requerido: ANFITRION. Reemplaza la lista completa (una lista vacía quita todo) y responde la publicación. Se puede en BORRADOR, ACTIVA y PAUSADA, sin cambiar el estado; en PENDIENTE_REVISION o BLOQUEADA responde 409. La publicación de otro anfitrión responde 404. Máximo 20 reglas de 1 a 200 caracteres, sin espacios sobrantes, en el orden recibido y sin repetidas. 400: falta la lista, una regla vacía o fuera de los límites.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesInput'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
  /listings/{id}/images:
    put:
      tags:
      - Alojamientos
      summary: Definir rutas o referencias de imágenes
      operationId: setImages
      description: 'Historias: HU-09 (CA-028). Rol requerido: ANFITRION. Reemplaza la lista completa (una lista vacía quita todo) y responde la publicación. Se puede en BORRADOR, ACTIVA y PAUSADA, sin cambiar el estado; en PENDIENTE_REVISION o BLOQUEADA responde 409. La publicación de otro anfitrión responde 404. Solo referencias como texto (no se suben archivos): máximo 10, de hasta 500 caracteres, que empiecen por http://, https:// o / y sin espacios; en el orden recibido (la primera es la foto principal) y sin repetidas. 400: falta la lista o una referencia no cumple el formato.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagesInput'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
  /listings/{id}/pricing:
    put:
      tags:
      - Alojamientos
      summary: Definir tarifa de limpieza, descuento por estancia larga y servicios adicionales
      operationId: setPricing
      description: 'Historias: HU-10. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingInput'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /listings/{id}/cancellation-policy:
    put:
      tags:
      - Alojamientos
      summary: Asociar política de cancelación
      operationId: setPolicy
      description: 'Historias: HU-11. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyAssociation'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /cancellation-policies:
    get:
      tags:
      - Alojamientos
      summary: Listar políticas de cancelación disponibles
      operationId: listPolicies
      description: 'Historias: HU-11.'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyList'
        '401':
          $ref: '#/components/responses/E401'
  /listings/{id}/submit:
    post:
      tags:
      - Alojamientos
      summary: Enviar a revisión (BORRADOR a PENDIENTE_REVISION)
      operationId: submitListing
      description: 'Historias: HU-12. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
  /listings/{id}/pause:
    post:
      tags:
      - Alojamientos
      summary: Pausar publicación (ACTIVA a PAUSADA)
      operationId: pauseListing
      description: 'Historias: HU-14. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /listings/{id}/resume:
    post:
      tags:
      - Alojamientos
      summary: Reactivar publicación (PAUSADA a ACTIVA); no permitido si está BLOQUEADA
      operationId: resumeListing
      description: 'Historias: HU-14. Rol requerido: ANFITRION.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /admin/listings:
    get:
      tags:
      - Alojamientos
      summary: Listar publicaciones por estado (p. ej. PENDIENTE_REVISION)
      operationId: adminListings
      description: 'Historias: HU-13. Rol requerido: ADMINISTRADOR.'
      parameters:
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/ListingStatus'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingList'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
  /admin/listings/{id}/approve:
    post:
      tags:
      - Alojamientos
      summary: Aprobar publicación (PENDIENTE_REVISION a ACTIVA)
      operationId: approveListing
      description: 'Historias: HU-13. Rol requerido: ADMINISTRADOR.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /admin/listings/{id}/reject:
    post:
      tags:
      - Alojamientos
      summary: Rechazar publicación indicando motivo
      operationId: rejectListing
      description: 'Historias: HU-13. Rol requerido: ADMINISTRADOR.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /admin/listings/{id}/block:
    post:
      tags:
      - Alojamientos
      summary: Bloquear publicación; reservas futuras pasan a EN_REVISION_MANUAL
      operationId: blockListing
      description: 'Historias: HU-34. Rol requerido: ADMINISTRADOR.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /internal/listings/{id}/quote-data:
    get:
      tags:
      - Alojamientos
      summary: Datos tarifarios para cotizar (lo consume Cotización)
      operationId: quoteData
      description: 'Historias: HU-22. Operación interna entre servicios (no expuesta al front).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteData'
        '404':
          $ref: '#/components/responses/E404'
  /internal/listings/{id}/cancellation-policy:
    get:
      tags:
      - Alojamientos
      summary: Política de cancelación de la publicación (la consume Reservas)
      operationId: internalPolicy
      description: 'Historias: HU-28. Operación interna entre servicios (no expuesta al front).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '404':
          $ref: '#/components/responses/E404'
  /internal/listings/{id}/owner:
    get:
      tags:
      - Alojamientos
      summary: Dueño y estado de la publicación (la consumen Disponibilidad y Reservas)
      operationId: listingOwner
      description: 'Historias: HU-07, HU-16, HU-17. Operación interna entre servicios (no expuesta al front, sin token). Responde en cualquier estado de la publicación. 400: el id no es un número.'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingOwner'
        '400':
          $ref: '#/components/responses/E400'
        '404':
          $ref: '#/components/responses/E404'
  /interno/publicaciones/activas:
    get:
      tags:
      - Alojamientos
      summary: Publicaciones ACTIVA de una ciudad (la consume Búsqueda)
      operationId: publicacionesActivas
      description: 'Historias: HU-19, HU-20. Operación interna entre servicios (no expuesta al front, sin token). Responde un arreglo, de la publicación más antigua a la más nueva. La ciudad se compara sin distinguir mayúsculas; sin ciudad responde todas las activas. Los demás filtros los aplica Búsqueda.'
      security: []
      parameters:
      - name: ciudad
        in: query
        schema:
          type: string
        description: Ciudad
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicacionResumen'
  /interno/publicaciones/{id}:
    get:
      tags:
      - Alojamientos
      summary: Detalle de una publicación (la consume Búsqueda)
      operationId: publicacionDetalle
      description: 'Historias: HU-21. Operación interna entre servicios (no expuesta al front, sin token). Responde en cualquier estado; Búsqueda solo muestra las ACTIVA. 400: el id no es un número.'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionDetalle'
        '400':
          $ref: '#/components/responses/E400'
        '404':
          $ref: '#/components/responses/E404'
  /interno/publicaciones/pausar:
    post:
      tags:
      - Alojamientos
      summary: Pausar las publicaciones activas de un anfitrión (lo invoca Identidad al desactivar la cuenta)
      operationId: pausarPorAnfitrion
      description: 'Historias: HU-06. Operación interna entre servicios (no expuesta al front, sin token). Las publicaciones ACTIVA del anfitrión pasan a PAUSADA; las demás no cambian. Se puede repetir: si el anfitrión no tiene publicaciones activas también responde 204. 400: falta idAnfitrion o no es un número.'
      security: []
      parameters:
      - name: idAnfitrion
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Operación exitosa
        '400':
          $ref: '#/components/responses/E400'
  /interno/publicaciones/estadisticas:
    get:
      tags:
      - Alojamientos
      summary: Cantidad de publicaciones activas para el dashboard (la consume Reportes)
      operationId: estadisticasPublicaciones
      description: 'Historias: HU-39. Operación interna entre servicios (no expuesta al front, sin token).'
      security: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AmenitiesInput:
      type: object
      properties:
        servicios:
          type: array
          items:
            type: string
            enum:
            - Wifi
            - Cocina
            - Aire acondicionado
            - Lavadora
            - Aparcamiento
            - Piscina
          example:
          - Wifi
          - Piscina
      required:
      - servicios
    Error:
      type: object
      description: Formato de error de todos los servicios
      properties:
        mensajes:
          type: array
          items:
            type: string
          example:
          - La capacidad debe ser un número entero entre 1 y 50
    ImagesInput:
      type: object
      properties:
        imagenes:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 500
            pattern: ^(https?://|/)\S+$
          example:
          - https://fotos.ejemplo.com/cabana-1.jpg
          - /imagenes/cabana-2.png
      required:
      - imagenes
    Listing:
      type: object
      properties:
        id:
          type: integer
          format: int64
        anfitrionId:
          type: integer
          format: int64
        titulo:
          type: string
        descripcion:
          type: string
        ciudad:
          type: string
        ubicacionTextual:
          type: string
        tipoAlojamiento:
          type: string
        capacidad:
          type: integer
        precioPorNoche:
          type: number
        tarifaLimpieza:
          type: number
        porcentajeDescuentoEstanciaLarga:
          type: number
        servicios:
          type: array
          items:
            type: string
        reglas:
          type: array
          items:
            type: string
        imagenes:
          type: array
          items:
            type: string
        politicaCancelacionId:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/ListingStatus'
        motivoRechazo:
          type: string
        motivoBloqueo:
          type: string
    ListingInput:
      type: object
      properties:
        titulo:
          type: string
          maxLength: 120
        descripcion:
          type: string
          maxLength: 2000
        ciudad:
          type: string
          maxLength: 80
        ubicacionTextual:
          type: string
          maxLength: 200
        tipoAlojamiento:
          type: string
          enum:
          - APARTAMENTO
          - CASA
          - HABITACION
          - CABANA
          - OTRO
        capacidad:
          type: integer
          minimum: 1
          maximum: 50
        precioPorNoche:
          type: integer
          minimum: 1
          maximum: 999999999
          description: Pesos, sin decimales
      required:
      - titulo
      - descripcion
      - ciudad
      - ubicacionTextual
      - tipoAlojamiento
      - capacidad
      - precioPorNoche
    ListingOwner:
      type: object
      properties:
        publicacionId:
          type: integer
          format: int64
        anfitrionId:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/ListingStatus'
    ListingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
    ListingStatus:
      type: string
      enum:
      - BORRADOR
      - PENDIENTE_REVISION
      - ACTIVA
      - PAUSADA
      - BLOQUEADA
    Policy:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        descripcion:
          type: string
        porcentajeDevolucion:
          type: number
        permiteLiberacionPeriodo:
          type: boolean
    PolicyAssociation:
      type: object
      properties:
        politicaId:
          type: integer
          format: int64
      required:
      - politicaId
    PolicyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
    PublicacionResumen:
      type: object
      description: Publicación con los nombres de campos que usa Búsqueda (tipo y precioNoche)
      properties:
        id:
          type: integer
          format: int64
        titulo:
          type: string
        ciudad:
          type: string
        tipo:
          type: string
        capacidad:
          type: integer
        precioNoche:
          type: number
        estado:
          $ref: '#/components/schemas/ListingStatus'
        servicios:
          type: array
          items:
            type: string
    PublicacionDetalle:
      allOf:
      - $ref: '#/components/schemas/PublicacionResumen'
      - type: object
        properties:
          descripcion:
            type: string
          reglas:
            type: array
            items:
              type: string
          imagenes:
            type: array
            items:
              type: string
          politicaCancelacion:
            type: string
            nullable: true
            description: Nombre de la política; null hasta que se asocie una (HU-11)
    PricingInput:
      type: object
      properties:
        tarifaLimpieza:
          type: number
          minimum: 0
        porcentajeDescuentoEstanciaLarga:
          type: number
          minimum: 0
          maximum: 100
        nochesMinimasDescuento:
          type: integer
          minimum: 1
        serviciosAdicionales:
          type: array
          items:
            type: object
            properties:
              nombre:
                type: string
              costo:
                type: number
                minimum: 0
            required:
            - nombre
            - costo
    QuoteData:
      type: object
      properties:
        publicacionId:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/ListingStatus'
        capacidad:
          type: integer
        precioPorNoche:
          type: number
        tarifaLimpieza:
          type: number
        porcentajeDescuentoEstanciaLarga:
          type: number
        nochesMinimasDescuento:
          type: integer
        serviciosAdicionales:
          type: array
          items:
            type: object
            properties:
              nombre:
                type: string
              costo:
                type: number
    ReasonInput:
      type: object
      properties:
        motivo:
          type: string
          minLength: 3
      required:
      - motivo
    RulesInput:
      type: object
      properties:
        reglas:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 200
          example:
          - No fumar
          - No se admiten mascotas
      required:
      - reglas
    Stats:
      type: object
      description: Indicadores de publicaciones para el dashboard
      properties:
        activas:
          type: integer
          format: int64
  responses:
    E400:
      description: Solicitud inválida (validación)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E401:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E403:
      description: Sin permiso para el rol o recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E404:
      description: No encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E409:
      description: Conflicto (reserva superpuesta, estado no permitido, duplicado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E503:
      description: Identidad no respondió
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E422:
      description: Regla de negocio no cumplida (p. ej. falta información mínima o capacidad excedida)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
