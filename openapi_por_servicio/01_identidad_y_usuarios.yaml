openapi: 3.0.3
info:
  title: Servicio Identidad y Usuarios - Marketplace de Alojamientos
  version: 1.0.0
  description: Contrato del servicio Identidad y Usuarios (implementado en services/identidad). Rutas públicas (las enruta el API Gateway) y rutas internas /interno/* entre servicios. Las marcadas como pendientes aún no están implementadas.
servers:
- url: http://localhost:8081
  description: Servicio Identidad y Usuarios (local)
security:
- bearerAuth: []
tags:
- name: Identidad y Usuarios
paths:
  /autenticacion/registro:
    post:
      tags:
      - Identidad y Usuarios
      summary: Registrar usuario Huésped o Anfitrión
      operationId: registrar
      description: 'Historias: HU-01 (CA-001, CA-002, CA-003, CA-127). ADMINISTRADOR no se puede elegir: viene precargado.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/E400'
  /autenticacion/login:
    post:
      tags:
      - Identidad y Usuarios
      summary: Iniciar sesión
      operationId: iniciarSesion
      description: 'Historias: HU-02 (CA-004, CA-005). Si el correo o la contraseña no coinciden responde el mismo mensaje general.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
  /autenticacion/logout:
    post:
      tags:
      - Identidad y Usuarios
      summary: Cerrar sesión
      operationId: cerrarSesion
      description: 'Historias: HU-02 (CA-006). El token deja de servir. Requiere el encabezado Authorization: Bearer <token de sesión>.'
      responses:
        '204':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/E401'
  /autenticacion/sesion:
    get:
      tags:
      - Identidad y Usuarios
      summary: Consultar el usuario de la sesión actual
      operationId: consultarSesion
      description: 'Historias: HU-02 (CA-006), HU-03 (CA-008). Requiere el encabezado Authorization: Bearer <token de sesión>.'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/E401'
  /autenticacion/autorizar:
    get:
      tags:
      - Identidad y Usuarios
      summary: Verificar rol y dueño (la usan los otros servicios)
      operationId: autorizar
      description: 'Historias: HU-03 (CA-007, CA-009). Responde el usuario si tiene uno de los roles y, si se envía idDueno, si es el dueño del recurso. Requiere el encabezado Authorization: Bearer <token de sesión>.'
      parameters:
      - name: roles
        in: query
        required: true
        description: Roles permitidos, separados por coma
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Rol'
        style: form
        explode: false
      - name: idDueno
        in: query
        required: false
        description: Id del dueño del recurso
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
  /autenticacion/reactivar:
    post:
      tags:
      - Identidad y Usuarios
      summary: Reactivar la cuenta
      operationId: reactivarCuenta
      description: 'Historias: HU-06 (CA-019). Con correo y contraseña; una cuenta RESTRINGIDA no se puede reactivar sola. Deja la sesión iniciada.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
  /autenticacion/recuperar-contrasena:
    post:
      tags:
      - Identidad y Usuarios
      summary: Solicitar recuperación simulada de contraseña
      operationId: recuperarContrasena
      description: 'Historias: HU-04. Pendiente de implementar.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperacionRequest'
      responses:
        '204':
          description: Solicitud registrada
        '400':
          $ref: '#/components/responses/E400'
  /autenticacion/restablecer-contrasena:
    post:
      tags:
      - Identidad y Usuarios
      summary: Restablecer la contraseña con el token de recuperación
      operationId: restablecerContrasena
      description: 'Historias: HU-04. Pendiente de implementar.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerRequest'
      responses:
        '204':
          description: Contraseña actualizada
        '400':
          $ref: '#/components/responses/E400'
        '410':
          $ref: '#/components/responses/E410'
  /usuarios/perfil:
    get:
      tags:
      - Identidad y Usuarios
      summary: Consultar mi perfil
      operationId: consultarPerfil
      description: 'Historias: HU-05 (CA-013). Requiere el encabezado Authorization: Bearer <token de sesión>.'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/E401'
    put:
      tags:
      - Identidad y Usuarios
      summary: Actualizar mi perfil
      operationId: actualizarPerfil
      description: 'Historias: HU-05 (CA-014, CA-015). Se pueden cambiar nombre y correo; el correo no puede ser de otra cuenta. Requiere el encabezado Authorization: Bearer <token de sesión>.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
  /usuarios/desactivar:
    post:
      tags:
      - Identidad y Usuarios
      summary: Desactivar mi cuenta
      operationId: desactivarCuenta
      description: 'Historias: HU-06 (CA-016, CA-017, CA-018). Cierra todas las sesiones; si es anfitrión pide pausar sus publicaciones. Requiere el encabezado Authorization: Bearer <token de sesión>.'
      responses:
        '204':
          description: Cuenta desactivada
        '401':
          $ref: '#/components/responses/E401'
        '409':
          $ref: '#/components/responses/E409'
  /admin/usuarios/{id}/estado:
    patch:
      tags:
      - Identidad y Usuarios
      summary: Restringir o reactivar un usuario
      operationId: cambiarEstadoUsuario
      description: 'Historias: HU-35. Rol requerido: ADMINISTRADOR. Pendiente de implementar.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstadoRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /interno/usuarios/estadisticas:
    get:
      tags:
      - Identidad y Usuarios
      summary: Conteo de usuarios para el dashboard
      operationId: estadisticasUsuarios
      description: 'Historias: HU-39. Operación interna entre servicios. Pendiente de implementar.'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estadisticas'
        '401':
          $ref: '#/components/responses/E401'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de sesión que entrega /autenticacion/login (se guarda en base de datos, no es JWT)
  schemas:
    Error:
      type: object
      description: Formato de error de todos los servicios
      properties:
        mensajes:
          type: array
          items:
            type: string
          example:
          - El correo ya está en uso
    Rol:
      type: string
      enum:
      - HUESPED
      - ANFITRION
      - ADMINISTRADOR
    EstadoUsuario:
      type: string
      enum:
      - ACTIVO
      - INACTIVO
      - RESTRINGIDO
    Usuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
        estado:
          $ref: '#/components/schemas/EstadoUsuario'
    RegistroRequest:
      type: object
      required:
      - nombre
      - correo
      - contrasena
      - rol
      properties:
        nombre:
          type: string
        correo:
          type: string
          format: email
        contrasena:
          type: string
          minLength: 8
        rol:
          type: string
          enum:
          - HUESPED
          - ANFITRION
          description: ADMINISTRADOR no se puede elegir (CA-003)
    LoginRequest:
      type: object
      required:
      - correo
      - contrasena
      properties:
        correo:
          type: string
        contrasena:
          type: string
    Sesion:
      type: object
      properties:
        token:
          type: string
          example: 3f2b8c1e-5d6a-4b7c-9e0f-1a2b3c4d5e6f
        usuario:
          $ref: '#/components/schemas/Usuario'
    PerfilRequest:
      type: object
      required:
      - nombre
      - correo
      properties:
        nombre:
          type: string
        correo:
          type: string
          format: email
    RecuperacionRequest:
      type: object
      required:
      - correo
      properties:
        correo:
          type: string
          format: email
    RestablecerRequest:
      type: object
      required:
      - token
      - nuevaContrasena
      properties:
        token:
          type: string
        nuevaContrasena:
          type: string
          minLength: 8
    CambioEstadoRequest:
      type: object
      required:
      - estado
      properties:
        estado:
          type: string
          enum:
          - ACTIVO
          - RESTRINGIDO
        motivo:
          type: string
    Estadisticas:
      type: object
      additionalProperties: true
      description: Indicadores agregados
  responses:
    E400:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E401:
      description: No ha iniciado sesión o la sesión no es válida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E403:
      description: No tiene permiso por su rol o porque no es el dueño
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E404:
      description: No encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E409:
      description: Conflicto (por ejemplo, reservas futuras confirmadas)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E410:
      description: Token vencido o ya usado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
