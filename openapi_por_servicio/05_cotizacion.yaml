openapi: 3.0.3
info:
  title: Servicio Cotización - Marketplace de Alojamientos
  version: 1.0.0
  description: 'Contrato del servicio Cotización: rutas públicas (las enruta el API Gateway) y rutas internas /internal/* (solo dentro de la red de Docker Compose). Swagger UI: http://localhost:8085/swagger-ui.html'
servers:
- url: http://localhost:8085
  description: Servicio Cotización (local)
security:
- bearerAuth: []
tags:
- name: Cotización
paths:
  /quotes:
    post:
      tags:
      - Cotización
      summary: Generar cotización desglosada
      operationId: createQuote
      description: 'Historias: HU-22 (CA-060 a CA-063), HU-10 (CA-029, CA-030, CA-129). Rol requerido: HUESPED (se verifica con Identidad /autenticacion/autorizar). Toma de Alojamientos (GET /internal/listings/{id}/quote-data) el precio por noche, la capacidad, la limpieza, el descuento y los servicios adicionales, y de /tarifas/servicio el porcentaje vigente. total = precioBase + tarifaLimpieza + servicios adicionales − descuento + tarifaServicio, donde precioBase = noches × precioPorNoche; el descuento es el porcentaje del anfitrión sobre precioBase si noches ≥ nochesMinimasDescuento; tarifaServicio es el porcentaje vigente sobre el subtotal (todo lo anterior). Cada parte se redondea al peso más cercano. La cotización se guarda y se consulta con GET /quotes/{id}. No verifica disponibilidad de fechas (lo hace Reservas al confirmar). 400: falta un dato, fechas con formato inválido, llegada antes de hoy, salida no posterior a la llegada, más de 365 noches o un servicio adicional que la publicación no ofrece. 404: la publicación no existe. 409: la publicación no está ACTIVA. 422: más huéspedes que la capacidad (CA-063). 503: Identidad o Alojamientos no responden.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '503':
          $ref: '#/components/responses/E503'
  /quotes/{id}:
    get:
      tags:
      - Cotización
      summary: Consultar una cotización
      operationId: getQuote
      description: 'Historias: HU-22, HU-23. Sin token: la consume Reservas para crear la reserva con el precio cotizado.'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '404':
          $ref: '#/components/responses/E404'
  /tarifas/servicio:
    get:
      tags:
      - Cotización
      summary: Consultar el % de la tarifa de servicio vigente
      operationId: consultarTarifa
      description: 'Historias: HU-38 (CA-105). Si el administrador no lo ha configurado es 0.'
      security: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarifa'
    put:
      tags:
      - Cotización
      summary: Configurar el % de la tarifa de servicio
      operationId: cambiarTarifa
      description: 'Historias: HU-38 (CA-105, CA-106, CA-107). Rol requerido: ADMINISTRADOR (se verifica con Identidad /autenticacion/autorizar). El cambio se registra en Auditoría. Requiere el encabezado Authorization: Bearer <token de sesión>.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TarifaRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarifa'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de sesión que entrega /autenticacion/login (se guarda en base de datos, no es JWT)
  schemas:
    Error:
      type: object
      description: Formato de error de todos los servicios
      properties:
        mensajes:
          type: array
          items:
            type: string
          example:
          - El correo ya está en uso
    Quote:
      type: object
      description: Valores en pesos, sin decimales
      properties:
        id:
          type: string
          format: uuid
        publicacionId:
          type: integer
          format: int64
        fechaLlegada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        cantidadHuespedes:
          type: integer
        noches:
          type: integer
        precioPorNoche:
          type: number
        precioBase:
          type: number
        tarifaLimpieza:
          type: number
        serviciosAdicionales:
          type: array
          items:
            type: object
            properties:
              nombre:
                type: string
              costo:
                type: number
        porcentajeDescuento:
          type: integer
          description: 0 si la estancia no cumple la condición de estancia larga
        descuento:
          type: number
        porcentajeTarifaServicio:
          type: number
        tarifaServicio:
          type: number
        total:
          type: number
          example: 1909000
    QuoteRequest:
      type: object
      properties:
        publicacionId:
          type: integer
          format: int64
        fechaLlegada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        cantidadHuespedes:
          type: integer
          minimum: 1
        serviciosAdicionales:
          type: array
          description: Nombres de los servicios adicionales que ofrece la publicación (opcional)
          items:
            type: string
          example:
          - Desayuno
      required:
      - publicacionId
      - fechaLlegada
      - fechaSalida
      - cantidadHuespedes
    TarifaRequest:
      type: object
      required:
      - porcentaje
      properties:
        porcentaje:
          type: number
          minimum: 0
          maximum: 100
          example: 15
    Tarifa:
      type: object
      properties:
        porcentaje:
          type: number
          example: 15
  responses:
    E400:
      description: Solicitud inválida (validación)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E401:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E403:
      description: Sin permiso para el rol o recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E404:
      description: No encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E409:
      description: La publicación no está ACTIVA
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E503:
      description: Identidad o Alojamientos no responden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E422:
      description: Regla de negocio no cumplida (p. ej. falta información mínima o capacidad excedida)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
