openapi: 3.0.3
info:
  title: Servicio Cotización - Marketplace de Alojamientos
  version: 1.0.0
  description: 'Contrato del servicio Cotización: rutas públicas (las enruta el API Gateway) y rutas internas /internal/* (solo dentro de la red de Docker Compose). Swagger UI: http://localhost:8085/swagger-ui.html'
servers:
- url: http://localhost:8085
  description: Servicio Cotización (local)
security:
- bearerAuth: []
tags:
- name: Cotización
paths:
  /quotes:
    post:
      tags:
      - Cotización
      summary: Generar cotización desglosada
      operationId: createQuote
      description: 'Historias: HU-22. Rol requerido: HUESPED.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
  /quotes/{id}:
    get:
      tags:
      - Cotización
      summary: Consultar una cotización
      operationId: getQuote
      description: 'Historias: HU-22.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
  /tarifas/servicio:
    get:
      tags:
      - Cotización
      summary: Consultar el % de la tarifa de servicio vigente
      operationId: consultarTarifa
      description: 'Historias: HU-38 (CA-105). Si el administrador no lo ha configurado es 0.'
      security: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarifa'
    put:
      tags:
      - Cotización
      summary: Configurar el % de la tarifa de servicio
      operationId: cambiarTarifa
      description: 'Historias: HU-38 (CA-105, CA-106, CA-107). Rol requerido: ADMINISTRADOR (se verifica con Identidad /autenticacion/autorizar). El cambio se registra en Auditoría. Requiere el encabezado Authorization: Bearer <token de sesión>.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TarifaRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarifa'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de sesión que entrega /autenticacion/login (se guarda en base de datos, no es JWT)
  schemas:
    Error:
      type: object
      description: Formato de error de todos los servicios
      properties:
        mensajes:
          type: array
          items:
            type: string
          example:
          - El correo ya está en uso
    Quote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        noches:
          type: integer
        precioBase:
          type: number
        tarifaLimpieza:
          type: number
        serviciosAdicionales:
          type: array
          items:
            type: object
            properties:
              nombre:
                type: string
              costo:
                type: number
        descuento:
          type: number
        porcentajeTarifaServicio:
          type: number
        tarifaServicio:
          type: number
        total:
          type: number
    QuoteRequest:
      type: object
      properties:
        publicacionId:
          type: string
          format: uuid
        fechaLlegada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        cantidadHuespedes:
          type: integer
          minimum: 1
        serviciosAdicionales:
          type: array
          items:
            type: string
      required:
      - publicacionId
      - fechaLlegada
      - fechaSalida
      - cantidadHuespedes
    TarifaRequest:
      type: object
      required:
      - porcentaje
      properties:
        porcentaje:
          type: number
          minimum: 0
          maximum: 100
          example: 15
    Tarifa:
      type: object
      properties:
        porcentaje:
          type: number
          example: 15
  responses:
    E400:
      description: Solicitud inválida (validación)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E401:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E403:
      description: Sin permiso para el rol o recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E404:
      description: No encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E422:
      description: Regla de negocio no cumplida (p. ej. falta información mínima o capacidad excedida)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
