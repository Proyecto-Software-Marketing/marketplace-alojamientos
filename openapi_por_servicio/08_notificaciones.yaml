openapi: 3.0.3
info:
  title: Servicio Notificaciones - Marketplace de Alojamientos
  version: 1.0.0
  description: 'Contrato del servicio Notificaciones: rutas públicas (las enruta el API Gateway) y rutas internas /internal/* (solo dentro de la red de Docker Compose). Swagger UI: http://localhost:8088/swagger-ui.html'
servers:
- url: http://localhost:8088
  description: Servicio Notificaciones (local)
security:
- bearerAuth: []
tags:
- name: Notificaciones
paths:
  /notifications:
    get:
      tags:
      - Notificaciones
      summary: Mis notificaciones, de la más reciente a la más antigua
      operationId: listNotifications
      description: 'Historias: HU-31.'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/E401'
  /notifications/{id}/read:
    patch:
      tags:
      - Notificaciones
      summary: Marcar notificación como leída
      operationId: markRead
      description: 'Historias: HU-31.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
  /internal/notifications:
    post:
      tags:
      - Notificaciones
      summary: Crear una notificación (asíncrono, con reintento)
      operationId: createNotification
      description: 'Historias: HU-30. Operación interna entre servicios (no expuesta al front), sin token. El servicio que origina el evento (Alojamientos al aprobar una publicación, Reservas al confirmar una reserva) envía una solicitud por cada usuario afectado. Es idempotente por usuarioId + tipoEvento + entidadId: un reintento devuelve 200 con la notificación existente.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationCreate'
      responses:
        '201':
          description: Notificación registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '200':
          description: Reintento; la notificación ya existía y se devuelve la misma
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/E400'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      description: Formato de error de todos los servicios
      properties:
        mensajes:
          type: array
          items:
            type: string
          example:
          - Tipo de evento no válido
    TipoEvento:
      type: string
      description: 'PUBLICACION_APROBADA y RESERVA_CONFIRMADA (HU-30); RESERVA_CANCELADA (HU-28), PUBLICACION_BLOQUEADA (HU-34) y USUARIO_RESTRINGIDO (HU-35).'
      enum:
      - PUBLICACION_APROBADA
      - RESERVA_CONFIRMADA
      - RESERVA_CANCELADA
      - PUBLICACION_BLOQUEADA
      - USUARIO_RESTRINGIDO
    EntidadTipo:
      type: string
      description: Se deduce del tipo de evento (PUBLICACION_* -> PUBLICACION, RESERVA_* -> RESERVA, USUARIO_* -> USUARIO)
      enum:
      - PUBLICACION
      - RESERVA
      - USUARIO
    Notification:
      type: object
      properties:
        id:
          type: integer
          format: int64
        usuarioId:
          type: integer
          format: int64
        tipoEvento:
          $ref: '#/components/schemas/TipoEvento'
        entidadTipo:
          $ref: '#/components/schemas/EntidadTipo'
        entidadId:
          type: integer
          format: int64
        mensaje:
          type: string
        leida:
          type: boolean
        creadaEn:
          type: string
          format: date-time
          description: Fecha y hora de Bogotá en que se registró
          example: '2026-11-14T18:05:00'
    NotificationCreate:
      type: object
      properties:
        usuarioId:
          type: integer
          format: int64
        tipoEvento:
          $ref: '#/components/schemas/TipoEvento'
        entidadTipo:
          $ref: '#/components/schemas/EntidadTipo'
        entidadId:
          type: integer
          format: int64
        mensaje:
          type: string
          maxLength: 500
          description: Opcional; si no se envía se usa el mensaje por defecto del evento
      required:
      - usuarioId
      - tipoEvento
      - entidadId
    NotificationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
  responses:
    E400:
      description: Solicitud inválida (validación)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E401:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E404:
      description: No encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
