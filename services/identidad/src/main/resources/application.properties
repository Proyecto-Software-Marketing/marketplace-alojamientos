spring.application.name=identidad

# Puerto local del servicio Identidad y Usuarios (tabla de puertos en Confluence)
server.port=8081

# Endpoints de monitoreo expuestos
management.endpoints.web.exposure.include=health,info

# Administrador precargado teniendo en cuenta que los datos vienen del .env
admin.correo=${ADMIN_EMAIL:}
admin.contrasena=${ADMIN_INITIAL_PASSWORD:}

# Direcciones de los otros servicios, vacias por el momento
servicios.reservas.url=${RESERVAS_URL:}
servicios.alojamientos.url=${ALOJAMIENTOS_URL:}