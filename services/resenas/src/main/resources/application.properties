spring.application.name=resenas

# Puerto del servicio Reseñas (tabla de puertos del README)
server.port=8089

# Endpoints de monitoreo expuestos
management.endpoints.web.exposure.include=health,info

# Zona horaria con la que se registra la fecha de cada reseña
resenas.zona-horaria=America/Bogota

# Direcciones de los otros servicios
servicios.identidad.url=${IDENTIDAD_URL:http://localhost:8081}
servicios.reservas.url=${RESERVAS_URL:http://localhost:8086}
