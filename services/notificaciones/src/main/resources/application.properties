spring.application.name=notificaciones

# Puerto del servicio Notificaciones (tabla de puertos del README)
server.port=8088

# Endpoints de monitoreo expuestos
management.endpoints.web.exposure.include=health,info

# Zona horaria con la que se registra la fecha de cada notificación (CA-084)
notificaciones.zona-horaria=America/Bogota

# Dirección del servicio de Identidad (HU-31: verificar la sesión del usuario)
servicios.identidad.url=${IDENTIDAD_URL:http://localhost:8081}
