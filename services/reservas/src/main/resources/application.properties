spring.application.name=reservas

# Puerto del servicio Reservas y Cancelaciones (tabla de puertos del README)
server.port=8086

# Endpoints de monitoreo expuestos
management.endpoints.web.exposure.include=health,info

# Direcciones de los otros servicios
servicios.identidad.url=${IDENTIDAD_URL:http://localhost:8081}
servicios.disponibilidad.url=${DISPONIBILIDAD_URL:http://localhost:8083}
servicios.cotizacion.url=${COTIZACION_URL:http://localhost:8085}
servicios.notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8088}
servicios.alojamientos.url=${ALOJAMIENTOS_URL:http://localhost:8082}

# HU-27: zona horaria del servicio y horario del cierre diario de estancias (00:05)
reservas.zona-horaria=America/Bogota
reservas.cierre-estancias.cron=${CIERRE_ESTANCIAS_CRON:0 5 0 * * *}
