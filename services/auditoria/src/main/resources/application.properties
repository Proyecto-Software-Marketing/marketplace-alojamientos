spring.application.name=auditoria
server.port=8090

management.endpoints.web.exposure.include=health,info

auditoria.zona-horaria=America/Bogota
spring.jpa.open-in-view=false

# HU-41 (CA-114): la consulta de auditoria valida el rol del administrador con Identidad
servicios.identidad.url=${IDENTIDAD_URL:http://localhost:8081}

# HU-42 CA-115: logs estructurados en JSON (formato ECS) con los campos del evento.
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.structured.format.console=ecs
logging.structured.json.context.include=true
logging.structured.json.add.evento=auditoria

# HU-42 CA-116: no registrar trazas internas de Spring ni cuerpos de solicitud.
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.servlet.mvc.method.annotation=WARN
