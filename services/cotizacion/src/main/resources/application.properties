spring.application.name=cotizacion

# Puerto del servicio de Cotización (tabla de puertos en Confluence)
server.port=8085

management.endpoints.web.exposure.include=health,info

# Direcciones de los otros servicios
servicios.identidad.url=${IDENTIDAD_URL:http://localhost:8081}
servicios.auditoria.url=${AUDITORIA_URL:}
servicios.alojamientos.url=${ALOJAMIENTOS_URL:http://localhost:8082}

# HU-22: zona horaria para saber qué día es hoy al validar la fecha de llegada
cotizacion.zona-horaria=America/Bogota
