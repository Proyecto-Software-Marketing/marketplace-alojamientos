spring.application.name=pagos
server.port=8087

management.endpoints.web.exposure.include=health,info

# Solo se permiten claves de prueba de Stripe.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.currency=${STRIPE_CURRENCY:cop}
# Base de datos temporal para desarrollo y pruebas
spring.datasource.url=${PAGOS_DB_URL:jdbc:h2:file:./data/pagosdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update