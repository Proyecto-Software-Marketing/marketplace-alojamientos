# Base de datos aislada para pruebas automatizadas.
spring.datasource.url=jdbc:h2:mem:pagos_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver

# Recrear el esquema solamente durante las pruebas.
spring.jpa.hibernate.ddl-auto=create-drop

# Mantener Stripe en modo prueba y moneda COP.
stripe.currency=cop