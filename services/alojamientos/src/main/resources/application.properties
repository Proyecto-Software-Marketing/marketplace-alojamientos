spring.application.name=alojamientos

# Puerto del servicio Alojamientos
server.port=8082

# Endpoints de monitoreo
management.endpoints.web.exposure.include=health,info

# Zona horaria
alojamientos.zona-horaria=America/Bogota

# Direcciones de los otros servicios
servicios.identidad.url=${IDENTIDAD_URL:http://localhost:8081}
servicios.auditoria.url=${AUDITORIA_URL:http://localhost:8090}
servicios.notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8088}
servicios.reservas.url=${RESERVAS_URL:http://localhost:8086}